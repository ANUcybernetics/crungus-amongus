# Hand-curated models: era-milestone legacy models absent from Replicate's
# text-to-image collection, plus per-model overrides for models that ARE in
# the collection (matched by owner/name; an override never duplicates).
#
# Fields per entry: owner, name (required); prompt_field, extra_inputs,
# output_field, release_date (original model release, overriding the
# Replicate version created_at proxy), description (visitor-facing copy read
# directly by publish), notes (internal curation and pipeline details).

# --- the reason this project exists ---
[[models]]
owner = "kuprel"
name = "min-dalle"
description = "Min-DALLE is a compact PyTorch implementation of DALL-E mini, the model family behind the original crungus discovery. It anchors the archive's early comparisons."
prompt_field = "text"
extra_inputs = { grid_size = 1, progressive_outputs = false, save_as_png = true }
release_date = 2022-06-01
notes = "PyTorch port of DALL-E mini, the model behind Craiyon and the original June 2022 crungus discovery"

# --- 2021–2022: before and around the crungus event ---
[[models]]
owner = "pixray"
name = "text2image"
description = "Pixray is a text-to-image system that uses CLIP to guide image creation. It captures an approach that preceded the widespread adoption of Stable Diffusion."
prompt_field = "prompts"
release_date = 2021-10-01
notes = "CLIP-guided pixray, the pre-diffusion aesthetic"

[[models]]
owner = "jack000"
name = "glid-3-xl"
description = "GLID-3 XL is an early latent-diffusion image model using CLIP text embeddings, placing it among the archive's models from around the original crungus discovery."
release_date = 2022-04-01
notes = "GLID-3 XL, early latent diffusion"

[[models]]
owner = "borisdayma"
name = "dalle-mini"
description = "DALL-E mini is the model behind the original crungus discovery in June 2022. This listing preserves a version from that month for comparison."
output_field = "image"
release_date = 2022-06-01
notes = "the original DALL-E mini, pinned at a 2022-06-14 version — the model and month of the crungus discovery. Returns [{image, clip_score}], hence output_field"

[[models]]
owner = "stability-ai"
name = "stable-diffusion"
description = "Stable Diffusion is Stability AI's early latent-diffusion image model, released shortly after the original crungus discovery. This listing represents the first-generation model family."
release_date = 2022-08-22
notes = "Stable Diffusion (1.x line as pinned on Replicate)"

[[models]]
owner = "prompthero"
name = "openjourney"
description = "Openjourney is a Stable Diffusion fine-tune trained on Midjourney V4 images, bringing that model's visual style into the archive through an independently hosted model."
release_date = 2022-11-01
notes = "Midjourney-style SD 1.5 fine-tune, peak 2022 aesthetic"

[[models]]
owner = "cjwbw"
name = "anything-v3.0"
description = "Anything V3 is a Stable Diffusion fine-tune specialising in anime imagery. It provides an early example of a model trained around a particular visual style."
release_date = 2022-12-01
notes = "anime SD fine-tune era artifact"

# --- 2023: the scale-up ---
[[models]]
