# Hand-curated models: era-milestone legacy models absent from Replicate's
# text-to-image collection, plus per-model overrides for models that ARE in
# the collection (matched by owner/name; an override never duplicates).
#
# Fields per entry: owner, name (required); prompt_field, extra_inputs,
# output_field, release_date (original model release, overriding the
# Replicate version created_at proxy), notes.

# --- the reason this project exists ---
[[models]]
owner = "kuprel"
name = "min-dalle"
prompt_field = "text"
extra_inputs = { grid_size = 1, progressive_outputs = false, save_as_png = true }
release_date = 2022-06-01
notes = "PyTorch port of DALL-E mini, the model behind Craiyon and the original June 2022 crungus discovery"

