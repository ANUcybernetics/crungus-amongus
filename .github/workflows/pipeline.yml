name: Pipeline

on:
  push:
    branches: [main]
    paths: [pipeline/**, mise.toml, .github/workflows/pipeline.yml]
  pull_request:
    paths: [pipeline/**, mise.toml, .github/workflows/pipeline.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run ty check

      - name: Test
        run: uv run pytest
